name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - name: Install isolated released KI CLI
        env:
          KI_ROOT: ${{ runner.temp }}/ki-fnd-001
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.agents" "$HOME/.claude"
          printf '{}\n' > "$HOME/.claude/settings.json"
          export KI_CLI_INSTALL_DIR="$KI_ROOT/bin"
          export KI_MAN_INSTALL_DIR="$KI_ROOT/share/man/man1"
          export XDG_DATA_HOME="$KI_ROOT/data"
          export XDG_CONFIG_HOME="$KI_ROOT/config"
          export XDG_CACHE_HOME="$KI_ROOT/cache"
          export XDG_STATE_HOME="$KI_ROOT/state"
          mkdir -p "$KI_ROOT"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/knowledgeislands/tools-ki/v0.3.6/install.sh \
            --output "$KI_ROOT/install.sh"
          bash "$KI_ROOT/install.sh" v0.3.6
          export PATH="$KI_CLI_INSTALL_DIR:$PATH"
          test "$(command -v ki)" = "$KI_CLI_INSTALL_DIR/ki"
          test "$(ki --version)" = "0.3.6"
          ki manage diag | tee "$KI_ROOT/ki-diag-before-bootstrap.txt"
          grep -F "Installation: regular" "$KI_ROOT/ki-diag-before-bootstrap.txt"
          grep -F "Executable: $KI_CLI_INSTALL_DIR/ki" "$KI_ROOT/ki-diag-before-bootstrap.txt"
          ki bootstrap
          ki registry add --repo .
          ki repo repair --repo .
          project_key=${GITHUB_WORKSPACE//\//-}
          mkdir -p "$HOME/.claude/projects/$project_key/memory"
          touch "$HOME/.claude/projects/$project_key/memory/MEMORY.md"
          ki manage diag | tee "$KI_ROOT/ki-diag.txt"
          grep -F "Status: valid" "$KI_ROOT/ki-diag.txt"
          ki harness list | grep -F 'knowledgeislands/ki-agentic-harness'
          {
            echo "KI_CLI_INSTALL_DIR=$KI_CLI_INSTALL_DIR"
            echo "KI_MAN_INSTALL_DIR=$KI_MAN_INSTALL_DIR"
            echo "XDG_DATA_HOME=$XDG_DATA_HOME"
            echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME"
            echo "XDG_CACHE_HOME=$XDG_CACHE_HOME"
            echo "XDG_STATE_HOME=$XDG_STATE_HOME"
          } >> "$GITHUB_ENV"
          echo "$KI_CLI_INSTALL_DIR" >> "$GITHUB_PATH"
      - run: ki repo audit --repo .
      - run: bun run test
      - run: bun run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      # Smoke test: boots the built server and verifies the wire-level tool surface
      # matches the in-process registration. Runs after the unit and coverage
      # gates; test:smoke builds dist/ inline.
      - run: bun run ki:test:smoke
